name: CI/CD

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v2

      - name: Test SSH Connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no ubuntu@47.129.246.242 'echo "SSH connection successful"'

      - name: Deploy with rsync
        uses: burnett01/rsync-deployments@5.1
        with:
          switches: -avzr --delete
          path: ./dist/*
          remote_path: /home/ubuntu/my-app/
          remote_host: 47.129.246.242
          remote_user: ubuntu
          remote_key: '${{ secrets.SSH_PRIVATE_KEY }}'
      - name: Start Server
        run: |
          #  This is the private key used to connect to the server(key.pem in ec2)
          ssh -o StrictHostKeyChecking=no ubuntu@47.129.246.242 '
            cd /home/ubuntu/my-app
            chmod +x deploy.sh
            ./deploy.sh
          '
